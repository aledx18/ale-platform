name: Release & Publish

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write    # Necesario para que Changesets cree PRs y tags
      packages: write    # Necesario para publicar en GitHub Packages
      pull-requests: write # Necesario para abrir la PR de release

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Requiere historial completo para generar los changelogs

      - name: Clean local npmrc
        run: rm -f .npmrc

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://npm.pkg.github.com'
          scope: '@aledx18'

      # Al usar bun install en la raíz, detecta tus workspaces correctamente
      - name: Install dependencies
        run: bun install

      - name: Build packages
        run: bun run --filter="./packages/*" build

      - name: Create Release PR or Publish
        uses: changesets/action@v1
        with:
          # Comando para actualizar versiones y lanzar la PR
          version: bunx changeset version
          # Publica solo las versiones pendientes que Changesets determina.
          publish: bunx changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
