name: Publish packages

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Create .npmrc
        run: |
          cat > ~/.npmrc <<EOF
          @aledx18:registry=https://npm.pkg.github.com
          //npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}
          always-auth=true
          EOF
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

      - name: Install dependencies
        run: bun install

      - name: Build packages
        run: bun run --filter="./packages/*" build

      # ----- DIAGNÓSTICO (puedes borrarlo cuando funcione) -----

      - name: Show npm configuration
        run: |
          echo "===== ~/.npmrc ====="
          cat ~/.npmrc || true
          echo ""
          echo "===== Registry ====="
          npm config get registry
          echo ""
          echo "===== Scope registry ====="
          npm config get @aledx18:registry

      - name: Verify token exists
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "❌ NODE_AUTH_TOKEN está vacío"
            exit 1
          else
            echo "✅ NODE_AUTH_TOKEN presente"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

      - name: Verify GitHub Packages login
        run: npm whoami --registry=https://npm.pkg.github.com
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

      # --------------------------------------------------------

      - name: Publish core
        working-directory: packages/core
        run: npm publish --registry=https://npm.pkg.github.com
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}